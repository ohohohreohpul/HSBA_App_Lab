# shadcn/ui-inspired theme: neutral zinc palette, near-black primary, white
# surfaces on a faint muted page. Locked to light so the custom styling
# (lib/theme.py) renders consistently for every viewer.
[theme]
base = "light"
primaryColor = "#18181b"           # zinc-900 (shadcn primary)
backgroundColor = "#fafafa"        # zinc-50 page
secondaryBackgroundColor = "#ffffff"
textColor = "#09090b"              # zinc-950
font = "sans serif"
